<!doctype html>
<html><head><meta charset="utf-8"><link rel="stylesheet" href="spacetime.css"></head>
<body>
  <main class='chat'><div class='log' data-log></div><form class='composer'><input class='composer__input' placeholder='Say something…'><button class='composer__send' type='button'>Send</button></form></main>
  
  <script src="spacetime.js"></script>
  <script>
    // The assign the LiveView pushes on connect, through the same channel the
    // bridge uses. Not a redeclaration of `$messages` — a write to it.
    (function () {
      var seed = [{"role":"user","text":"What is a contract, in one sentence?"},{"role":"model","text":"A contract is the seam between two runtimes, written once so neither half can drift from the other."},{"role":"user","text":"And who checks it?"},{"role":"model","text":"The compiler does — a reply the page cannot decode is a build error, not a surprise in the browser."}];
      function push() {
        if (!window.SpacetimeLocal) return false;
        window.SpacetimeLocal["messages"] = seed;
        document.dispatchEvent(
          new CustomEvent("local:messages:updated", { detail: seed })
        );
        return true;
      }
      if (!push()) {
        var t = setInterval(function () { if (push()) clearInterval(t); }, 10);
        setTimeout(function () { clearInterval(t); }, 4000);
      }
    })();
  </script>
</body></html>
