[package]
name = "bl-browser-port"
version = "0.1.0"
edition = "2021"
license = "EPL-2.0"
description = "Supervised native Chromium/display lifecycle over BEAM packet-4 JSON"

[[bin]]
name = "bl-browser-port"
path = "src/main.rs"
required-features = ["native-browser"]

[features]
default = []
native-browser = ["dep:serde_json", "dep:tungstenite", "dep:fs2", "dep:libc"]
x11 = ["native-browser", "dep:getrandom"]

[dependencies]
serde_json = { version = "1", optional = true }
tungstenite = { version = "0.26", optional = true }
fs2 = { version = "0.4", optional = true }
libc = { version = "0.2", optional = true }
getrandom = { version = "0.3", optional = true }

[profile.release]
strip = true
