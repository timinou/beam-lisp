name: ci

# The toolchain builds, tests and packages without Mix.
#
# ONE step still uses it — `mix deps.get && mix deps.compile` — and that is the
# honest state of the removal, not an oversight: 44 of the 47 locked packages
# build with `mix` and 3 with `rebar3`, so a Mix-free fetch-and-compile is its own
# piece of work. `bl.lock` already records the same set with the same digests, and
# `mix.lock` cannot drift from it (`BeamLisp.DepsLockTest`). Everything after that
# step is `bl`:
#
#   bl build       the AOT driver (priv/build/build.bl), no Mix
#   bl test        .bl files through ward, .exs files through ExUnit, no Mix
#   bl self-build  the drop rebuilds itself and the result runs, no Mix
#
# `bl` here is `./bin/bl` — the checkout launcher, which starts the app, puts the
# beams on the code path and calls the CLI entry point the drop also uses.

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

env:
  MIX_ENV: test

jobs:
  test:
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4

      - uses: erlef/setup-beam@v1
        with:
          otp-version: "29.0"
          elixir-version: "1.20"

      # The one Mix step in the pipeline: dependency provisioning.
      - name: dependencies (Mix; the last thing it is still needed for)
        run: |
          mix deps.get
          mix deps.compile

      # Everything below is the toolchain under test.
      - name: build
        run: ./bin/bl build --force

      - name: test
        run: ./bin/bl test

      - name: the drop builds itself, and the result runs
        run: |
          ./bin/bl self-build --out /tmp/bl-self
          /tmp/bl-self version
          /tmp/bl-self eval '(println (+ 40 2))' | grep -qx 42
