name: ci

# The toolchain builds, tests and packages without Mix — and now with no Mix step
# anywhere in the pipeline.
#
# The one step this workflow used to have was dependency provisioning
# (`mix deps.get && mix deps.compile`), and it was honest at the time: 44 of the
# 47 locked packages built with `mix` and 3 with `rebar3`, and nothing else could
# turn a lock into usable beams. Both halves are now `bl`:
#
#
#   bl deps fetch      obtains every locked tarball into a content-addressed
#                      store, verifying the digest the lock names
#   bl deps compile    compiles each library FOR THIS RUNTIME, into
#                      ~/.cache/beam_lisp/ebin/<name>-<vsn>-<sha8>-<runtime>
#
# A library whose own sources read Mix at compile time (`explorer` asks
# `Mix.Project.config/0` for its version and repository) is answered from its OWN
# declaration inside an explicit compile window that is closed again afterwards
# (see `BeamLisp.DepsCompileShim`), and a library that ships Mix TASKS has those
# task files excluded — they are for a Mix consumer, and there is no Mix consumer
# here. `mix.exs`, `mix.lock` and `lib/mix/tasks/` are deleted; `bl.lock` is the
# one lock, and `BeamLisp.DepsLockTest` asserts it is whole.
#
# Everything below is the toolchain under test:
#
#   bl build       the AOT driver (priv/build/build.bl), no Mix
#   bl test        .bl files through ward, .exs files through ExUnit, no Mix
#   bl self-build  the drop rebuilds itself and the result runs, no Mix
#
# `bl` here is `./bin/bl` — the checkout launcher, which installs the committed
# compiler floor, starts the app, puts the beams on the code path and calls the
# CLI entry point the drop also uses.

on:
  push:
    branches: [main]
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]
  workflow_dispatch:
    inputs:
      runtime_run:
        description: "Reuse a prior CI runtime for qualification-only changes (run ID)"
        required: false
        default: ""

# Full qualifications supersede older full runs on the same branch. Draft
# checks have a separate slot: a late push event for the SAME revision must
# not cancel an explicitly requested full qualification.
concurrency:
  group: ci-${{ github.event.pull_request.head.ref || github.ref_name }}-${{ github.event_name == 'pull_request' && github.event.pull_request.draft && 'quick' || 'full' }}-${{ inputs.runtime_run || 'producer' }}
  cancel-in-progress: true

# Producer and artifact consumers may land on different runner image rollouts.
# Their Cargo identity must agree before any content-addressed native lookup.
env:
  CI_RUST_VERSION: "1.99.1"

permissions:
  contents: read
  actions: read

jobs:
  public-evidence:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Embedded test library matches its source
        run: python3 scripts/embed-test-library.py --check
      - name: CI, embedding and publication boundary controls
        run: python3 -m unittest discover -s scripts/tests
      - name: Inspect every new commit blob before native builds
        env:
          PUBLIC_EVIDENCE_BASE: ${{ github.event.pull_request.base.sha || github.event.before }}
          PUBLIC_EVIDENCE_EVENT: ${{ github.event_name }}
          PUBLIC_EVIDENCE_DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
        run: |
          set -eu
          # Dispatch events have no before/base SHA. Compare the branch's new
          # commits to its actual merge base, as PR checks do; scanning every
          # historical blob would recheck already-deleted baseline artifacts.
          if [ "$PUBLIC_EVIDENCE_EVENT" = workflow_dispatch ] && [ -z "$PUBLIC_EVIDENCE_BASE" ]; then
            git fetch --no-tags origin "refs/heads/$PUBLIC_EVIDENCE_DEFAULT_BRANCH:refs/remotes/origin/$PUBLIC_EVIDENCE_DEFAULT_BRANCH"
            PUBLIC_EVIDENCE_BASE=$(git merge-base HEAD "refs/remotes/origin/$PUBLIC_EVIDENCE_DEFAULT_BRANCH")
            if [ "$PUBLIC_EVIDENCE_BASE" = "$(git rev-parse HEAD)" ]; then
              PUBLIC_EVIDENCE_BASE=$(git rev-parse --verify HEAD^ 2>/dev/null || true)
            fi
          fi
          if [ -n "$PUBLIC_EVIDENCE_BASE" ] && ! printf '%s' "$PUBLIC_EVIDENCE_BASE" | grep -Eq '^0+$'; then
            git cat-file -e "$PUBLIC_EVIDENCE_BASE^{commit}" 2>/dev/null || git fetch --no-tags origin "$PUBLIC_EVIDENCE_BASE"
            python3 scripts/check-public-evidence.py --base "$PUBLIC_EVIDENCE_BASE" --head HEAD
          else
            python3 scripts/check-public-evidence.py --head HEAD
          fi

  prepare-linux:
    if: (github.event_name != 'pull_request' || !github.event.pull_request.draft) && !inputs.runtime_run
    needs: public-evidence
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4

      - uses: erlef/setup-beam@v1
        with:
          otp-version: "29.0"
          elixir-version: "1.20"

      - name: Select the shared native toolchain
        run: |
          set -eu
          rustup toolchain install "$CI_RUST_VERSION" --profile minimal
          rustup override set "$CI_RUST_VERSION"
          echo "RUSTUP_TOOLCHAIN=$CI_RUST_VERSION" >> "$GITHUB_ENV"
          cargo --version
          rustc --version

      # The invariant, checked before anything is built: this repository has no
      # Mix project. A step that could pass because Mix happens to be installed
      # would not be a check.
      - name: no Mix in the tree
        run: |
          test ! -e mix.exs
          test ! -e mix.lock
          test ! -d lib/mix
          echo "no mix.exs, no mix.lock, no lib/mix — bl.lock is the one lock"

      # `bin/bl` is how a checkout runs itself, and a file mode is not something
      # a test can notice after the fact: a fresh clone that cannot execute its
      # own launcher fails with `Permission denied`, and CI has already shipped
      # that failure once (the commit that fixed it is in this file's history).
      # An edit that rewrites the script drops the bit; this is the guard.
      - name: the launcher is executable
        run: test -x bin/bl

      # BEFORE the first `bl` call, and that placement is the whole point.
      # `bl deps compile` builds the locked libraries' native code — including
      # `wry_webview`, a Linux-only capability (gtk + webkit2gtk +
      # wlr-layer-shell) whose Cargo.toml target-gates those deps. Without the
      # headers `gobject-sys`/`glib-sys` fail pkg-config and THIS step goes red,
      # not the build step — which is exactly what it did.
      - name: Install WebKitGTK toolchain
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            libgtk-3-dev libwebkit2gtk-4.1-dev libgtk-layer-shell-dev tesseract-ocr

      # The one artefact the language cannot build for itself. A cold tree has no
      # `priv/native` — it is a build output (`.gitignore` line 61), installed by
      # the native stage rather than tracked — and the boot needs
      # `priv/native/lazy_memo` before any step that could build it has run:
      # `BeamLisp.LazyMemo.load_nif!/0` loads from ONE path with no fallback, and
      # the prelude interns LazySeq, so a runner without it dies at the first
      # `bl` call with "BeamLisp LazySeq requires the lazy_memo native runtime".
      #
      # No `bl` command can produce it — `bl` is what needs it. Cargo can: the
      # crate is an ordinary cdylib, so this builds it directly and installs it
      # where the NIF loader looks. `bl build`'s native stage then finds it
      # current and moves on.
      - name: Bootstrap the native crates the boot needs
        run: |
          set -eu
          mkdir -p priv/native
          case "$(uname -s)" in Darwin) ext=dylib ;; *) ext=so ;; esac
          for crate in lazy_memo; do
            cargo build --release --manifest-path "native/$crate/Cargo.toml"
            install -m 755 "native/$crate/target/release/lib$crate.$ext" \
                            "priv/native/$crate.so"
          done
          ls -l priv/native

      # Cache addressed producer artifacts, never the loose priv/native
      # projection. Prefix restores must not overwrite the mandatory runtime
      # just compiled above with another source revision's NIF ABI.
      - name: Restore the content-addressed native and library store
        id: addressed-store
        uses: actions/cache/restore@v4
        with:
          path: |
            ~/.cache/beam_lisp
          key: ci-${{ runner.os }}-${{ runner.arch }}-otp29-elixir1.20-${{ hashFiles('bl.lock', 'native/**/Cargo.*', 'native/**/src/**', 'native/**/build.rs', 'tooling/drop/Cargo.*', 'tooling/drop/src/**') }}-${{ github.sha }}-${{ github.run_id }}-${{ github.run_attempt }}
          # Each attempt can publish newly completed addressed products, even
          # after an earlier attempt of this revision failed later in the job.
          restore-keys: |
            ci-${{ runner.os }}-${{ runner.arch }}-otp29-elixir1.20-

      - name: dependencies — bl alone, fetch then compile for this runtime
        id: dependencies
        run: |
          ./bin/bl --cold deps fetch
          ./bin/bl --cold deps compile

      # Runtime startup retains the immutable SDK. Compiler regeneration runs
      # in the bare VM below; this step prepares natives and app metadata.
      - name: Prepare natives and application metadata
        run: ./bin/bl --cold run scripts/prepare-release.bl

      - name: Fetch the pinned solver used by integration tests
        run: ./bin/bl --cold install z3

      - name: Fetch pinned embeddings used by index integration tests
        run: ./bin/bl --cold install embed

      # The committed floor (priv/bootstrap/seed) is a self-hosted fixpoint:
      # regenerating it from this tree reproduces every byte. A change to
      # priv/boot, priv/host or the emitter that was not followed by
      # `scripts/regenerate-seed`, or anything that makes a beam depend on the
      # machine or the run, shows up here as a diff.
      - name: the floor reproduces itself
        run: |
          set -eu
          out="$RUNNER_TEMP/regen"
          # From scratch: reusing the committed floor's host beams would make
          # this check pass by construction.
          BL_REGEN_FROM_SCRATCH=1 scripts/regenerate-seed "$out"
          scripts/floor-diff priv/bootstrap/seed "$out/seed" --quiet || {
            echo "::error::priv/bootstrap/seed is not what this tree regenerates. Run scripts/regenerate-seed and commit the floor."
            exit 1
          }
          cmp priv/bootstrap/seed/manifest.term "$out/seed/manifest.term"
          diff -r priv/bootstrap/seed "$out/seed"

      - name: Kernel file custody excludes independent processes and survives crashes
        run: |
          ./bin/bl --cold version
          python3 test/scripts/file_locks.py --image "$PWD/.bl/lib/beam_lisp-0.1.0"


      # The normal SDK producer publishes complete addressed units. Share
      # those verified cache products too: otherwise every shard repeats the
      # SDK source/constructor work, and the later release job repeats it again.
      # The qualification job still checks a second build and its real output.
      - name: Build the stock launcher for checkout self-builds
        run: cargo build --release --locked --manifest-path tooling/drop/Cargo.toml --bin drop-launcher
      - name: Prepare the shared SDK through the normal self-build
        run: ./bin/bl --cold self-build --bin tooling/drop/target/release/drop-launcher --out "$RUNNER_TEMP/bl-ci-producer"
      - name: Verify complete SDK cache entries before sharing them
        run: ./bin/bl --cold run scripts/check-sdk-cache.bl

      # Completed addressed products remain individually verified on reuse.
      # A later native/solver failure must not discard all dependency work.
      # Keep failed/cancelled runtime images out of the same-run artifact below.
      - name: Save completed addressed products after provisioning
        if: ${{ always() && !cancelled() && steps.dependencies.outcome == 'success' }}
        uses: actions/cache/save@v4
        with:
          path: ~/.cache/beam_lisp
          key: ${{ steps.addressed-store.outputs.cache-primary-key }}

      # One producer for this run and revision. Tar preserves native executable
      # modes; consumers restore the addressed cache to the same HOME layout.
      - name: Package the prepared Linux runtime
        run: python3 scripts/package-ci-runtime.py --out "$RUNNER_TEMP" --candidate "$RUNNER_TEMP/bl-ci-producer"
      - uses: actions/upload-artifact@v4
        with:
          name: ci-linux-runtime
          path: |
            ${{ runner.temp }}/ci-runtime.tar.gz
            ${{ runner.temp }}/ci-store.tar.gz
          compression-level: 0
          retention-days: 1

  reuse-linux:
    if: inputs.runtime_run
    needs: public-evidence
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Prove this qualification uses the producer's exact runtime inputs
        env:
          GH_TOKEN: ${{ github.token }}
          RUNTIME_RUN: ${{ inputs.runtime_run }}
        run: |
          set -eu
          python3 -c 'import os; assert os.environ["RUNTIME_RUN"].isdigit()'
          producer=$(gh api "repos/$GITHUB_REPOSITORY/actions/runs/$RUNTIME_RUN" --jq .head_sha)
          python3 scripts/check-ci-runtime-reuse.py --base "$producer"
          printf '%s\n' "$producer" > "$RUNNER_TEMP/runtime-producer-sha"
      - uses: actions/download-artifact@v4
        with:
          name: ci-linux-runtime
          path: ${{ runner.temp }}/ci-linux-runtime
          github-token: ${{ github.token }}
          run-id: ${{ inputs.runtime_run }}
      - run: mv "$RUNNER_TEMP/runtime-producer-sha" "$RUNNER_TEMP/ci-linux-runtime/"
      - uses: actions/upload-artifact@v4
        with:
          name: ci-linux-runtime
          path: ${{ runner.temp }}/ci-linux-runtime/
          compression-level: 0
          retention-days: 1

  test:
    if: ${{ !cancelled() && (needs.prepare-linux.result == 'success' || needs.reuse-linux.result == 'success') }}
    strategy:
      fail-fast: false
      max-parallel: 4
      matrix:
        shard: [0, 1, 2, 3]
    needs: [prepare-linux, reuse-linux]
    runs-on: ubuntu-24.04
    timeout-minutes: 100
    steps:
      - uses: actions/checkout@v4
      - uses: erlef/setup-beam@v1
        with:
          otp-version: "29.0"
          elixir-version: "1.20"

      - name: Select the shared native toolchain
        run: |
          set -eu
          rustup toolchain install "$CI_RUST_VERSION" --profile minimal
          rustup override set "$CI_RUST_VERSION"
          echo "RUSTUP_TOOLCHAIN=$CI_RUST_VERSION" >> "$GITHUB_ENV"
          cargo --version
          rustc --version
      - name: Install native runtime libraries
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            libgtk-3-0t64 libwebkit2gtk-4.1-0 libgtk-layer-shell0 tesseract-ocr inotify-tools
      - uses: actions/download-artifact@v4
        with:
          name: ci-linux-runtime
          path: ${{ runner.temp }}/ci-linux-runtime
      - name: Restore this revision's prepared runtime
        run: |
          set -eu
          tar -xzf "$RUNNER_TEMP/ci-linux-runtime/ci-runtime.tar.gz"
          tar -xzf "$RUNNER_TEMP/ci-linux-runtime/ci-store.tar.gz" -C "$HOME"
      # The complete corpus, one serial capped VM per runner. No dependency or
      # native compilation is repeated by the four consumers.
      - name: test partition
        run: python3 scripts/ci-test-shard.py --index ${{ matrix.shard }} --count 4
      - name: Keep per-file qualification receipts even on failure
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-results-${{ matrix.shard }}
          path: ${{ runner.temp }}/bl-test-results-${{ matrix.shard }}.jsonl
          if-no-files-found: warn
          retention-days: 7

  qualify-linux:
    if: ${{ !inputs.runtime_run }}
    needs: prepare-linux
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: erlef/setup-beam@v1
        with:
          otp-version: "29.0"
          elixir-version: "1.20"

      - name: Select the shared native toolchain
        run: |
          set -eu
          rustup toolchain install "$CI_RUST_VERSION" --profile minimal
          rustup override set "$CI_RUST_VERSION"
          echo "RUSTUP_TOOLCHAIN=$CI_RUST_VERSION" >> "$GITHUB_ENV"
          cargo --version
          rustc --version
      - name: Install native runtime libraries
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            libgtk-3-0t64 libwebkit2gtk-4.1-0 libgtk-layer-shell0 tesseract-ocr inotify-tools
      - uses: actions/download-artifact@v4
        with:
          name: ci-linux-runtime
          path: ${{ runner.temp }}/ci-linux-runtime
      - name: Restore this revision's prepared runtime
        run: |
          set -eu
          tar -xzf "$RUNNER_TEMP/ci-linux-runtime/ci-runtime.tar.gz"
          tar -xzf "$RUNNER_TEMP/ci-linux-runtime/ci-store.tar.gz" -C "$HOME"
      - name: the drop builds itself, and the result reuses its default VM
        run: |
          systemd-run --user --collect --wait --pipe --quiet \
            --working-directory="$PWD" --property=MemoryMax=6G --property=MemorySwapMax=0 \
            --property=RuntimeMaxSec=1800 --setenv=PATH="$PATH" python3 scripts/qualify-self-build.py

  # The nix-built server drop (docs/native-bundler.md §16): `nix flake check` is the
  # gate — the drop evaluates, its glibc floor is <= the servers' 2.40 — and the pin
  # check keeps this flake's nixpkgs equal to Foundry's.
  nix-drop:
    if: ${{ !inputs.runtime_run && (github.event_name != 'pull_request' || !github.event.pull_request.draft) }}
    # Independent artifact/backend gate: discover Nix failures while Linux
    # tests run. The complete workflow must still pass before release.
    needs: public-evidence
    runs-on: ubuntu-24.04
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4

      - uses: cachix/install-nix-action@v31

      - name: Pins agree with the servers
        # apps/foundry is a separate repo; only checked where it is checked out
        run: if [ -f apps/foundry/infra/flake.lock ]; then tooling/drop/check-pins.sh; else echo 'foundry not checked out; pin check skipped'; fi

      - name: nix flake check
        run: nix flake check -L

      - name: nix build .#bl-drop
        run: nix build .#bl-drop -L

  producer-gates:
    if: inputs.runtime_run
    needs: [reuse-linux, test]
    runs-on: ubuntu-24.04
    timeout-minutes: 130
    steps:
      - uses: actions/checkout@v4
      - name: Require the original runtime's floor, self-build and Nix gates
        env:
          GH_TOKEN: ${{ github.token }}
        run: python3 scripts/wait-ci-producer.py --run '${{ inputs.runtime_run }}'
