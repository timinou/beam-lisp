<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>bl-ed · .bl.org</title>
<link rel="stylesheet" href="./theme.css">
<script type="module" src="./host.mjs"></script>
</head>
<body data-mode="normal">
  <header id="titlebar">
    <span class="brand">bl<span class="dot">·</span>ed</span>
    <span class="hint"><kbd>space</kbd><kbd>?</kbd> keys &nbsp; <kbd>space</kbd><kbd>space</kbd> commands &nbsp; <kbd>:</kbd> beam lisp &nbsp; <kbd>space</kbd><kbd>o</kbd> outline</span>
  </header>
  <main id="editor" aria-label="editor">
    <div id="gutter" aria-hidden="true"></div>
    <div id="page">
      <div id="selections" aria-hidden="true"></div>
      <div id="caret" aria-hidden="true"></div>
      <div id="lines" role="textbox" aria-multiline="true"></div>
      <textarea id="input-sink" autocapitalize="off" autocomplete="off" autocorrect="off" spellcheck="false" aria-label="input"></textarea>
    </div>
    <div id="scrollbar" aria-hidden="true"><div id="scroll-hint"></div></div>
  </main>
  <footer>
    <div id="status"></div>
    <div id="echo" role="status" aria-live="polite"></div>
  </footer>
  <section id="minibuf" hidden>
    <div class="line-in"><span class="prompt"></span><span class="text"></span><span class="cursor"></span></div>
    <ul class="matches"></ul>
  </section>
  <section id="overlay" hidden>
    <h2></h2>
    <ul></ul>
    <p class="close"><kbd>Esc</kbd> to close</p>
  </section>
</body>
</html>
