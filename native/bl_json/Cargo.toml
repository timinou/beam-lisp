[package]
name = "bl_json"
version = "0.1.0"
edition = "2021"

[lib]
name = "bl_json"
path = "src/lib.rs"
crate-type = ["cdylib"]

[dependencies]
# rustler 0.38 is what every other crate here uses, and serde_json is already
# in the workspace's lockfile via code_embed — so this adds no new dependency
# class to the tree.
rustler = "0.38"
# `arbitrary_precision` is LOAD-BEARING — do not remove it to go faster.
#
# Tried 2026-09-21, because floats pay for it: with the flag on, a float arrives as
# a one-entry map and costs an extra visit (a `[1.5]` document counts 3 nodes,
# 1 without), plus a String for the key and another for the value. Small ints do
# NOT take that path (a `[1,2,3]` document counts 4 either way), so the flag is a
# float-side cost only.
#
# But without it serde_json does not ERROR on an integer wider than i64/u64 — it
# silently becomes an f64, and `123456789012345678901234567890` decodes to
# `1.2345678901234568e29`. Six tests catch it (bl.json-test/integers-are-exact,
# data-survives-a-round-trip, and four in json_differential_test), but the failure
# mode is silent data loss, and this flag is the only thing that keeps the lexeme
# in hand so `bl.json` can DECLINE to `otp-decode` and let the BEAM build a real
# bignum. A NIF cannot build one.
#
# The float cost is therefore the price of the bignum guarantee, and going faster
# here means reading the lexeme without allocating — not dropping the flag.
serde_json = { version = "1.0", features = ["arbitrary_precision"] }
serde = "1.0"

[profile.release]
lto = true
codegen-units = 1
