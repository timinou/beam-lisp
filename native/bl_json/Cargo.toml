[package]
name = "bl_json"
version = "0.1.0"
edition = "2021"

[lib]
name = "bl_json"
path = "src/lib.rs"
crate-type = ["cdylib"]

[dependencies]
# rustler 0.38 is what every other crate here uses, and serde_json is already
# in the workspace's lockfile via code_embed — so this adds no new dependency
# class to the tree.
rustler = "0.38"
serde_json = { version = "1.0", features = ["arbitrary_precision"] }
serde = "1.0"

[profile.release]
lto = true
codegen-units = 1
