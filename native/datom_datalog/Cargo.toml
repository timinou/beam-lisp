[package]
name = "datom_datalog"
version = "0.1.0"
edition = "2021"

[lib]
name = "datom_datalog"
path = "src/lib.rs"
crate-type = ["cdylib"]

[dependencies]
rustler = "0.38"

[profile.release]
# The fixpoint loop is the hot path — tuple joins, hash probes, set
# difference in tight loops. LTO + one codegen unit let the optimiser inline
# the join kernels into the semi-naive driver.
lto = true
codegen-units = 1
