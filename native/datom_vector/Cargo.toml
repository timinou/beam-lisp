[package]
name = "datom_vector"
version = "0.1.0"
edition = "2021"

[lib]
name = "datom_vector"
path = "src/lib.rs"
crate-type = ["cdylib"]

[dependencies]
rustler = "0.38"
hnsw_rs = "0.3"

[profile.release]
# The vector kernel is the one place raw numeric throughput matters, and
# the coarse pass (XOR + popcount) and the f32 dot both autovectorise. LTO
# and a single codegen unit let the optimiser inline `hamming`/`dot` into
# the scan loops.
lto = true
codegen-units = 1
