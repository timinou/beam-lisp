[package]
name = "wry_webview"
version = "0.1.0"
edition = "2021"

[lib]
name = "wry_webview"
path = "src/lib.rs"
crate-type = ["cdylib"]

[dependencies]
rustler = "0.38"
# wry is the WebView; tao is its event loop / windowing. Pinned together:
# wry 0.55 is built against tao 0.35, and its Linux path uses webkit2gtk
# v2_38 (this host carries 2.52). `default` already pulls os-webview + x11;
# we additionally lean on the gtk container path (build_gtk) so the window
# works under Wayland as well as X11 — the reason a bare `winit` build is
# not enough here.
wry = "0.55"
tao = "0.35"
gtk = "0.18"
# wlr-layer-shell, via GTK. A scrollable-tiling / wlroots compositor (sway,
# niri, hyprland) ignores X11-isms like always-on-top and absolute x/y; the
# CORRECT way to pin a bar to a screen edge, keep it above tiled windows, and
# reserve its strip (so windows tile below it) is the wlr-layer-shell protocol.
# This crate wraps the system libgtk-layer-shell (≥0.6) and pins to gtk 0.18,
# matching ours. v0_6 gives auto-exclusive-zone. It is a no-op on X11.
gtk-layer-shell = { version = "0.8", features = ["v0_6"] }

[profile.release]
# A GUI NIF is not a hot numeric loop; default opt is fine. Keep codegen
# units at the cargo default — LTO buys nothing here and slows the build.
