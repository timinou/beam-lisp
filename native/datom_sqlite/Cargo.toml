[package]
name = "datom_sqlite"
version = "0.1.0"
edition = "2021"

[lib]
name = "datom_sqlite"
path = "src/lib.rs"
crate-type = ["cdylib"]

[dependencies]
rustler = "0.38"
# `bundled` compiles SQLite from vendored source (needs a C compiler, which
# the native build already assumes for the other crates). This makes the
# backend self-contained — no system libsqlite3 dependency, one known version
# — which is what a benchmark against fjall wants: the engine, not the
# distro's packaging of it.
rusqlite = { version = "0.32", features = ["bundled"] }

[profile.release]
# Match datom_datalog's release profile so the two durable backends are
# compared on equal optimiser footing: the hot path here is the prepared-
# statement step loop inside `range`/`commit`, and LTO lets the SQLite calls
# inline into it.
lto = true
codegen-units = 1
