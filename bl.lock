;; bl.lock — this tree's resolved dependencies, as facts.
;;
;; The SAME set and the SAME digests `mix.lock` held: a change of file format, not
;; a re-resolution. Nothing here chooses a version — a lock names versions,
;; `bl deps fetch` obtains exactly those, `bl deps verify` proves the store holds
;; them offline. A resolver that pretends to be a fetcher is how a build becomes
;; unreproducible, so resolution stays a separate problem.
;;
;; The digest is the hex TARBALL's sha256 — the same value Mix wrote — so the
;; conversion cannot silently change what a build means.
;;
;; WHICH of mix.lock's two digests that is had to be measured, on toml 0.7.0:
;;
;;   field 4   fbcd773c…  the CHECKSUM file INSIDE the tarball — hex_core's
;;                        "inner checksum", which it DEPRECATES ("The inner
;;                        checksum is deprecated in favor of the outer
;;                        checksum"). It is NOT sha256 of contents.tar.gz; that
;;                        is a third value, 8cf00edd…. A client cannot recompute
;;                        the inner checksum without reimplementing hex's
;;                        canonicalisation of the contents.
;;   field 8   0690246a…  sha256 of the bytes served at
;;                        repo.hex.pm/tarballs/toml-0.7.0.tar — what `bl deps
;;                        fetch` downloads and hashes, and what hex_core's own
;;                        docs say to check ("Remember to verify the OUTER
;;                        tarball checksum against the registry checksum").
;;
;; So this lock names field 8. The first conversion took field 4 and could not
;; install a single package: 47 of 47 digests differed from the bytes hex serves.
