[package]
name = "drop"
version = "0.1.0"
edition = "2021"
description = "drop — beam-lisp native bundler: self-extracting release binaries (docs/native-bundler.md)"

# The LAUNCHER links only flate2+tar+sha2 (pure Rust → `rustup target`
# cross-builds without a C toolchain). The `drop` pack tool additionally
# shells out to curl/7z for ERTS fetch+unpack rather than growing a TLS
# dependency tree into every cross-target build (§8 of the spec).
[dependencies]
flate2 = "1"
tar = "0.4"
sha2 = "0.10"

[[bin]]
name = "drop"
path = "src/pack.rs"

[[bin]]
name = "drop-launcher"
path = "src/launcher.rs"
