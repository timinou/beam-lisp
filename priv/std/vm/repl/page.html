<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>bl repl</title>
<style>
:root{color-scheme:dark}
body{margin:0;background:#0b0a10;color:#ece9f5;font:14px/1.5 ui-sans-serif,system-ui,sans-serif;height:100vh;display:flex;flex-direction:column}
header{padding:.45rem .9rem;border-bottom:1px solid #2c2838;display:flex;gap:1rem;align-items:baseline;font-size:.8rem;color:#9891ad}
header b{color:#ece9f5}.mono{font-family:ui-monospace,SFMono-Regular,Menlo,monospace}
#log{flex:1;overflow-y:auto;padding:.6rem .9rem;font-family:ui-monospace,SFMono-Regular,Menlo,monospace;font-size:.88rem;white-space:pre-wrap}
.entry{margin:.12rem 0}.entry .src{color:#7c5cff}.entry .val{color:#46d18f}.entry .err{color:#ff8f8f}
.entry .out{color:#c9c3da}.meta{color:#5c5670;font-size:.75rem}
.entry .more{color:#7c5cff;cursor:pointer;user-select:none}.entry .more:hover{text-decoration:underline}
/* the prompt row: a transcript line, contiguous with the log */
#prompt-row{display:flex;align-items:flex-start;gap:.5rem;padding:.25rem .9rem .35rem;border-top:1px solid #2c2838;background:#0b0a10;font-family:ui-monospace,SFMono-Regular,Menlo,monospace}
#prompt-label{color:#7c5cff;font-size:.88rem;padding-top:.28rem;white-space:nowrap;cursor:text;user-select:none}
#editor-wrap{flex:1}
.cm-editor{background:transparent;font-size:.88rem}.cm-editor.cm-focused{outline:none}
.cm-gutters{display:none}
.cm-activeLine{background:transparent}
.cm-cursor{border-left-color:#b7a8ff}
.cm-tooltip.cm-tooltip-autocomplete{background:#16141f;border:1px solid #2c2838;font-family:ui-monospace,SFMono-Regular,Menlo,monospace;font-size:.82rem}
.cm-tooltip.cm-tooltip-autocomplete ul li[aria-selected]{background:#2a2440}
.cm-tooltip-autocomplete .cm-completionDetail{font-style:normal;color:#9891ad;margin-left:.8em}
/* the hints pane */
#hints{border-top:1px solid #2c2838;background:#100e18;min-height:4.6rem;max-height:9rem;overflow-y:auto;padding:.4rem .9rem;display:flex;gap:1rem;align-items:flex-start}
#hints .body{flex:1;font-size:.8rem}
#hints .hname{font-family:ui-monospace,SFMono-Regular,Menlo,monospace;color:#b7a8ff;font-size:.85rem}
#hints .hargs{color:#46d18f;margin-left:.7em;font-family:ui-monospace,SFMono-Regular,Menlo,monospace}
#hints .hns{color:#b4551f;margin-left:.7em;font-size:.75rem}
#hints .hdoc{color:#9891ad;margin-top:.15rem;white-space:pre-wrap}
#hints .idle{color:#5c5670;font-size:.75rem}
#hints .btns{display:flex;gap:.5rem}
button{font:inherit;font-size:.72rem;color:#ece9f5;background:#201d2c;border:1px solid #2c2838;border-radius:9999px;padding:.1rem .6rem;cursor:pointer}
button:hover{border-color:#7c5cff}
</style>
</head>
<body>
<header><b>bl repl</b><span>daemon</span><span id="sess" class="mono">connecting…</span><span style="flex:1"></span><span id="balance"></span></header>
<div id="log"></div>
<div id="prompt-row"><span id="prompt-label">user=&gt;</span><div id="editor-wrap"></div></div>
<div id="hints"><div class="body"><span class="idle">Tab = completion · Enter = eval (when balanced) · Shift+Enter = newline · Ctrl+↑/↓ = history · Esc = close dropdown</span></div>
<div class="btns"><button id="interrupt">interrupt</button></div></div>
<script>
window.addEventListener('error', e => { try{ localStorage.setItem('bl-repl-err', (e.message||'?') + ' @' + (e.filename||'') + ':' + e.lineno); }catch(_){}});
window.addEventListener('unhandledrejection', e => { try{ localStorage.setItem('bl-repl-err', 'reject: ' + (e.reason && e.reason.message || e.reason)); }catch(_){}});
</script>
<script type="module">
const BL_TOKEN = __BL_TOKEN__;
import {EditorView, basicSetup, keymap, autocompletion, startCompletion, currentCompletions, selectedCompletionIndex, completionStatus, StreamLanguage, syntaxHighlighting, defaultHighlightStyle, clojure, insertNewlineAndIndent} from "/repl/editor.bundle.js?v=1";

// ── the balanced? port (correct semantics — BUG-087 pinned the server side) ──
function balanced(src){
  const gs=[...src]; let stack=[],str=false,esc=false,comment=false;
  for(const ch of gs){
    if(comment){ if(ch==="\n")comment=false; continue; }
    if(esc){ esc=false; continue; }
    if(str){ if(ch==="\\")esc=true; else if(ch==='"')str=false; continue; }
    if(ch==='"'){str=true;continue;}
    if(ch===";"){comment=true;continue;}
    if(ch==="(")stack.push(")"); else if(ch==="[")stack.push("]"); else if(ch==="{")stack.push("}");
    else if(ch===")"||ch==="]"||ch==="}"){ if(stack.pop()!==ch) return false; }
  }
  return stack.length===0 && !str;
}

// live balance indicator — reflects what Enter will do with the CURRENT input
function updateBalance(){
  const src=view.state.doc.toString(); const b=el("balance");
  if(!src.trim()){ b.textContent=""; return; }
  const ok=balanced(src);
  b.textContent=ok?"balanced ✓ — Enter evals":"…incomplete — Enter newlines";
  b.style.color=ok?"#46d18f":"#d1a946";
}

// ── ws rpc ──
let ws, seq=0, pending=new Map(), session=null, curNs="user";
function connect(){
  const stored=localStorage.getItem("bl-repl-session")||"";
  ws=new WebSocket(`ws://${location.host}/repl/ws?token=${encodeURIComponent(BL_TOKEN)}${stored?`&session=${encodeURIComponent(stored)}`:""}`);
  ws.onclose=()=>{
    // flush in-flight rpcs — their replies died with the socket
    if(pending.size){ log("err","connection lost — in-flight request(s) dropped"); pending.clear(); }
    log("err","socket closed — reconnecting in 1s"); setTimeout(connect,1000);
  };
  ws.onmessage=(ev)=>{ onMessage(JSON.parse(ev.data)); };
}
function onMessage(m){
  const t0=pending.get(m.id)?.t0;
  const rtt = t0!=null ? Math.round(performance.now()-t0) : null;
  if(m.kind==="hello"){ const prev=session; session=m.session; curNs=m.ns; showNs();
    if(m.reattached) log("meta",`reattached to ${session} — defs and ns preserved`);
    else if(prev&&prev!==session) log("meta",`reconnected as ${session} — previous session's state is gone`);
    else if(!prev){ const stored=localStorage.getItem("bl-repl-session");
      if(stored&&stored!==session) log("meta",`${stored} is gone (daemon restarted?) — fresh session ${session}`); }
    localStorage.setItem("bl-repl-session",session);
    return; }
  if(m.kind==="out"){ appendMaybeCollapsed(lastEntry(),"out",m.text); return; }
  if(m.kind==="value"){ curNs=m.ns||curNs; showNs();
    appendMaybeCollapsed(lastEntry(),"val",`=> ${m.text}`); meta(lastEntry(),`eval ${m.ms}ms server · ${rtt}ms rtt`); pending.delete(m.id); return; }
  if(m.kind==="error"&&m.id!=null&&pending.has(m.id)){ appendMaybeCollapsed(lastEntry(),"err",`${m.interrupted?"⛔ interrupted — ":"error: "}${m.text}`);
    meta(lastEntry(),`${m.ms}ms server · ${rtt}ms rtt`); pending.delete(m.id); return; }
  if(m.kind==="busy"){ append(lastEntry(),"err","busy — an eval is running (interrupt to kill it)"); pending.delete(m.id); return; }
  if(m.kind==="interrupt-sent"){ log("meta","interrupt sent"); pending.delete(m.id); return; }
  if(m.kind==="not-busy"){ log("meta","nothing running"); pending.delete(m.id); return; }
  if(m.kind==="completions"){ const p=pending.get(m.id); pending.delete(m.id); p?.resolve(m); return; }
  if(m.kind==="doc"){ const p=pending.get(m.id); pending.delete(m.id); p?.resolve(m); return; }
  if(m.kind==="balanced"){ const p=pending.get(m.id); pending.delete(m.id); p?.resolve(m); return; }
  if(m.kind==="bench"){ pending.delete(m.id);
    hint(`completion bench — corpus ${m.corpus} vars · index build ${m["index-build-ms"]}ms · direct 5q×10 ${m["direct-5q-x10-ms"]}ms · indexed 5q×100 ${m["indexed-5q-x100-ms"]}ms`,"idle"); return; }
}
function rpc(op,fields={}){
  const id=++seq;
  return new Promise((resolve)=>{ pending.set(id,{resolve,t0:performance.now()}); ws.send(JSON.stringify({op,id,...fields})); });
}
function el(id){return document.getElementById(id);}
function showNs(){ el("sess").textContent=`${session} · ns ${curNs}`; el("prompt-label").textContent=`${curNs}=>`; }
let entryCount=0; function lastEntry(){return el("e"+entryCount);}
function log(cls,text){ const d=document.createElement("div"); d.className="entry "+cls; d.textContent=text; el("log").appendChild(d); el("log").scrollTop=1e9; return d; }
function append(parent,cls,text){ if(!parent) return; const s=document.createElement("span"); s.className="entry "+cls; s.textContent=(parent.childNodes.length?"\n":"")+text; parent.appendChild(s); el("log").scrollTop=1e9; }
function meta(parent,text){ const s=document.createElement("span"); s.className="meta"; s.textContent="  ·  "+text; parent.appendChild(s); }
// A long value or stdout dump would bury the transcript. Collapse anything
// past a screenful behind a click; short entries render exactly as before.
const COLLAPSE_LINES=14, COLLAPSE_CHARS=2000;
function appendMaybeCollapsed(parent,cls,text){
  const lines=text.split("\n");
  if(lines.length<=COLLAPSE_LINES && text.length<=COLLAPSE_CHARS){ append(parent,cls,text); return; }
  let head=lines.slice(0,COLLAPSE_LINES).join("\n");
  if(head.length>COLLAPSE_CHARS) head=head.slice(0,COLLAPSE_CHARS);
  const wrap=document.createElement("div");
  const shown=document.createElement("span"); shown.className="entry "+cls;
  const more=document.createElement("span"); more.className="entry more";
  let open=false;
  const pre=parent.childNodes.length?"\n":"";   // captured once: after the wrap is appended, childNodes always has one
  const label=()=>open?"▾ collapse":`▸ ${text.length-head.length} more chars — click to expand`;
  shown.textContent=pre+head; more.textContent="  "+label();
  more.onclick=()=>{ open=!open; shown.textContent=pre+(open?text:head); more.textContent="  "+label(); el("log").scrollTop=1e9; };
  wrap.appendChild(shown); wrap.appendChild(more); parent.appendChild(wrap); el("log").scrollTop=1e9;
}

// ── the hints pane ──
const IDLE_HINTS='<span class="idle">Tab = completion · Enter = eval (when balanced) · Shift+Enter = newline · Ctrl+↑/↓ = history · Esc = close dropdown</span>';
function hint(html,cls){
  el("hints").querySelector(".body").innerHTML = cls==="idle" ? `<span class="idle">${html}</span>` : html;
}
function hintDoc(name,ns,arglists,doc){
  const args = arglists ? `<span class="hargs">${escapeHtml(arglists)}</span>` : "";
  const nsHtml = ns ? `<span class="hns">${escapeHtml(ns)}</span>` : "";
  const docHtml = doc ? `<div class="hdoc">${escapeHtml(doc)}</div>` : `<div class="hdoc" style="color:#5c5670">(no docstring)</div>`;
  hint(`<span class="hname">${escapeHtml(name)}</span>${args}${nsHtml}${docHtml}`);
}
function escapeHtml(s){ return String(s).replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;"); }
function hintIdle(){ el("hints").querySelector(".body").innerHTML = IDLE_HINTS; }

// ── eval ──
const hist=[]; let histIx=-1;
function submitEval(src){
  hist.push(src); localStorage.setItem("bl-repl-hist",JSON.stringify(hist.slice(-500))); histIx=-1;
  const e=log("","");
  append(e,"src",`${curNs}=> ${src}`); entryCount++; e.id="e"+entryCount;
  rpc("eval",{src});
  view.dispatch({changes:{from:0,to:view.state.doc.length,insert:""}});
  hintIdle();
}

// ── completion + hints ──
let lastItems=new Map();   // label → server item, from the last complete rpc
async function completeSource(ctx){
  const word=ctx.matchBefore(/[A-Za-z0-9_\-.!*+?/<>=$]{1,}$/);
  if(!word) return null;
  const r=await rpc("complete",{prefix:word.text});
  lastItems=new Map(r.items.map(i=>[i.label,i]));
  const options=r.items.map(i=>({label:i.label, detail:i.arglists?`${i.ns} · ${i.arglists}`:i.ns}));
  return {from:word.from, validFor:/^[A-Za-z0-9_\-.!*+?/<>=$]*$/, options};
}
function syncHintsFromDropdown(state){
  if(completionStatus(state)!=="active") return false;
  const ix=selectedCompletionIndex(state);
  const cs=currentCompletions(state);
  if(ix==null||!cs[ix]) return true; // open but nothing selected yet
  const item=lastItems.get(cs[ix].label);
  if(item) hintDoc(item.label, item.ns, item.arglists, item.doc);
  else hint(`<span class="hname">${escapeHtml(cs[ix].label)}</span><span class="hdoc">…</span>`);
  return true;
}
let docTimer=null;
function idleDocHint(state){
  // dropdown closed: doc for the symbol before the cursor (debounced)
  clearTimeout(docTimer);
  docTimer=setTimeout(async ()=>{
    if(completionStatus(view.state)) return;
    const pos=view.state.selection.main.head;
    const before=view.state.doc.sliceString(Math.max(0,pos-80),pos);
    const m=before.match(/([A-Za-z0-9_\-.!*+?/<>=$]{2,})$/);
    if(!m){ hintIdle(); return; }
    const r=await rpc("doc",{ns:"auto",name:m[1]});
    hintDoc(r.name, r.ns, r.arglists, r.doc);
  },350);
}

// ── editor: the prompt lives in the transcript flow, not a bottom pane ──
const view=new EditorView({
  parent: el("editor-wrap"),
  doc:"",
  extensions:[
    keymap.of([
      {key:"Enter",run:(v)=>{ const src=v.state.doc.toString(); if(src.trim()&&balanced(src)){ submitEval(src); return true; } return insertNewlineAndIndent(v); }},
      {key:"Shift-Enter",run:insertNewlineAndIndent},
      {key:"Tab",run:(v)=>{ startCompletion(v); return true; }},
      {key:"Ctrl-ArrowUp",run:()=>{ if(!hist.length)return true; histIx=histIx<0?hist.length-1:Math.max(0,histIx-1); setDoc(hist[histIx]); return true; }},
      {key:"Ctrl-ArrowDown",run:()=>{ if(histIx<0)return true; histIx=histIx+1>=hist.length?-1:histIx+1; setDoc(histIx<0?"":hist[histIx]); return true; }},
    ]),
    basicSetup,
    StreamLanguage.define(clojure),
    syntaxHighlighting(defaultHighlightStyle,{fallback:true}),
    EditorView.theme({},{dark:true}),
    autocompletion({override:[completeSource], activateOnTyping:false}),
    EditorView.updateListener.of((update)=>{
      if(!syncHintsFromDropdown(update.state) && (update.selectionSet||update.docChanged)) idleDocHint(update.state);
      if(update.selectionSet||update.docChanged) syncHintsFromDropdown(update.state);
      if(update.docChanged) updateBalance();
    }),
  ],
});
function setDoc(s){ view.dispatch({changes:{from:0,to:view.state.doc.length,insert:s}}); }
try{ const saved=JSON.parse(localStorage.getItem("bl-repl-hist")||"[]"); hist.push(...saved); }catch(e){}

el("prompt-label").onclick=()=>view.focus();
el("interrupt").onclick=()=>rpc("interrupt");
connect();
view.focus();
</script>
</body>
</html>
