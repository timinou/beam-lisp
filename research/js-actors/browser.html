<!doctype html>
<meta charset="utf-8">
<title>BL JavaScript actor prototype — Worker verification</title>
<h1>BL actor prototype: browser Worker check</h1>
<p>Build first, then serve this directory over HTTP. The generated BL tests run in a module Worker.</p>
<pre id="result">Running…</pre>
<script type="module">
const result = document.querySelector('#result');
const bundle = new URL('./out/bundle.mjs', location.href).href;
window.actorVerification = { state: 'running', logs: [] };
const source = `
  let ticks = 0;
  const timer = setInterval(() => ticks++, 5);
  console.log = (...args) => postMessage({ kind: 'log', text: args.join(' ') });
  try {
    await import(${JSON.stringify(bundle)});
    postMessage({ kind: 'done', ticks });
  } catch (error) {
    postMessage({ kind: 'error', text: String(error.stack || error) });
  } finally { clearInterval(timer); }
`;
const url = URL.createObjectURL(new Blob([source], { type: 'text/javascript' }));
const worker = new Worker(url, { type: 'module' });
let settled = false;
const deadline = setTimeout(() => finish('failed', 'Worker exceeded 120 seconds'), 120000);
function finish(state, detail) {
  if (settled) return;
  settled = true;
  clearTimeout(deadline);
  worker.terminate();
  URL.revokeObjectURL(url);
  Object.assign(window.actorVerification, { state, detail });
  result.textContent = state.toUpperCase() + '\n' + detail + '\n\n' + window.actorVerification.logs.join('\n');
}
worker.onerror = event => finish('failed', event.message);
worker.onmessage = ({ data }) => {
  if (data.kind === 'log') {
    window.actorVerification.logs.push(data.text);
    result.textContent = window.actorVerification.logs.join('\n');
  } else if (data.kind === 'error') {
    finish('failed', data.text);
  } else if (data.kind === 'done') {
    const logs = window.actorVerification.logs;
    const passed = logs.filter(line => line.startsWith('PASS ')).length;
    const failed = logs.some(line => /^(FAIL |process .* failed:|actor runtime error:)/.test(line));
    const ok = passed > 0 && !failed && logs.includes('js-actors: ALL PASS') && data.ticks > 0;
    finish(ok ? 'passed' : 'failed', `${passed} checks; ${data.ticks} Worker timer ticks`);
  }
};
</script>
