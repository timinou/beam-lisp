[package]
name = "j1_nif"
version = "0.1.0"
edition = "2021"

[lib]
name = "j1_nif"
path = "src/lib.rs"
crate-type = ["cdylib"]

[dependencies]
# Same rustler line as every crate under native/ — one NIF ABI in this tree.
rustler = "0.38"
# The one compiler and the one verified kernel; this crate adds only resource
# lifetime, caps and counters.
j1_probe = { path = "../j1_probe" }
