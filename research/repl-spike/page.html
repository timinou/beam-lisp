<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>bl repl — spike</title>
<style>
:root{color-scheme:dark}
body{margin:0;background:#0b0a10;color:#ece9f5;font:14px/1.5 ui-sans-serif,system-ui,sans-serif;height:100vh;display:flex;flex-direction:column}
header{padding:.45rem .9rem;border-bottom:1px solid #2c2838;display:flex;gap:1rem;align-items:baseline;font-size:.8rem;color:#9891ad}
header b{color:#ece9f5}.mono{font-family:ui-monospace,SFMono-Regular,Menlo,monospace}
#log{flex:1;overflow-y:auto;padding:.8rem .9rem;font-family:ui-monospace,SFMono-Regular,Menlo,monospace;font-size:.85rem;white-space:pre-wrap}
.entry{margin:.15rem 0}.entry .src{color:#7c5cff}.entry .val{color:#46d18f}.entry .err{color:#ff8f8f}
.entry .out{color:#c9c3da}.meta{color:#5c5670;font-size:.75rem}
#editor-wrap{border-top:1px solid #2c2838}
.cm-editor{background:#12101a;font-size:.92rem;min-height:7rem}.cm-editor.cm-focused{outline:none}
.cm-gutters{background:#12101a;color:#3d3852;border-right:1px solid #2c2838}
.cm-activeLine{background:#1a1726}
.cm-tooltip.cm-tooltip-autocomplete{background:#16141f;border:1px solid #2c2838}
.cm-tooltip.cm-tooltip-autocomplete ul li[aria-selected]{background:#2a2440}
.cm-tooltip-autocomplete .cm-completionDetail{font-style:normal;color:#9891ad;margin-left:.8em}
button{font:inherit;font-size:.75rem;color:#ece9f5;background:#201d2c;border:1px solid #2c2838;border-radius:9999px;padding:.1rem .6rem;cursor:pointer}
button:hover{border-color:#7c5cff}
#bar{padding:.3rem .9rem;border-top:1px solid #2c2838;display:flex;gap:.6rem;align-items:center;font-size:.75rem;color:#9891ad}
</style>
</head>
<body>
<header><b>bl repl</b><span>spike · PLAN-135</span><span id="sess" class="mono">connecting…</span><span style="flex:1"></span><span id="parity"></span></header>
<div id="log"></div>
<script>
window.addEventListener('error', e => { try{ localStorage.setItem('repl-spike-err', (e.message||'?') + ' @' + (e.filename||'') + ':' + e.lineno); }catch(_){}});
window.addEventListener('unhandledrejection', e => { try{ localStorage.setItem('repl-spike-err', 'reject: ' + (e.reason && e.reason.message || e.reason)); }catch(_){}});
</script>
<div id="editor-wrap"></div>
<div id="bar">
  <span>Enter = eval (when balanced) · Shift+Enter = newline · Ctrl+↑/↓ = history</span>
  <span style="flex:1"></span>
  <button id="interrupt">interrupt</button>
  <button id="bench">bench completion</button>
</div>
<script type="module">
import {EditorView, basicSetup, keymap, autocompletion, StreamLanguage, syntaxHighlighting, defaultHighlightStyle, clojure, insertNewlineAndIndent, history as cmHistory} from "/vendor/editor.bundle.js";

// ── U5: the balanced? port — transliterated from priv/std/bl/repl.bl.md ──
function balanced(src){
  const gs=[...src]; let stack=[],str=false,esc=false,comment=false;
  for(const ch of gs){
    if(comment){ if(ch==="\n")comment=false; continue; }
    if(esc){ esc=false; continue; }
    if(str){ if(ch==="\\")esc=true; else if(ch==='"')str=false; continue; }
    if(ch==='"'){str=true;continue;}
    if(ch===";"){comment=true;continue;}
    if(ch==="(")stack.push(")"); else if(ch==="[")stack.push("]"); else if(ch==="{")stack.push("}");
    else if(ch===")"||ch==="]"||ch==="}"){ if(stack.pop()!==ch) return false; }
  }
  return stack.length===0 && !str;
}
const FIXTURES=[
  "(+ 1 2)", "(+ 1", "(println \"(\")", "; )", "(def s \"\\\"\")", "(a [b {c}])",
  "(a [b)", "\"unterminated", "(map inc [1 2])\n(+ 1 2)", "]", "", "  \n  ", "(;(\n)"
];

// ── ws rpc ──
let ws, seq=0, pending=new Map(), session=null, curNs="user", lastEvalId=null;
function connect(){
  ws=new WebSocket(`ws://${location.host}/ws`);
  ws.onopen=()=>{};
  ws.onclose=()=>{ log("err","socket closed — reconnecting in 1s"); setTimeout(connect,1000); };
  ws.onmessage=(ev)=>{
    const m=JSON.parse(ev.data), t0=pending.get(m.id)?.t0;
    const rtt = t0!=null ? Math.round(performance.now()-t0) : null;
    if(m.kind==="hello"){ session=m.session; curNs=m.ns; el("sess").textContent=`${m.session} · ns ${m.ns}`; parity(); return; }
    if(m.kind==="out"){ append(lastEntry(),"out",m.text); return; }
    if(m.kind==="value"){ curNs=m.ns||curNs; el("sess").textContent=`${session} · ns ${curNs}`;
      append(lastEntry(),"val",`=> ${m.text}`); meta(lastEntry(),`eval ${m.ms}ms server · ${rtt}ms rtt`); pending.delete(m.id); return; }
    if(m.kind==="error"&&m.id!=null&&pending.has(m.id)){ append(lastEntry(),"err",`${m.interrupted?"⛔ interrupted — ":"error: "}${m.text}`);
      meta(lastEntry(),`${m.ms}ms server · ${rtt}ms rtt`); pending.delete(m.id); return; }
    if(m.kind==="busy"){ append(lastEntry(),"err","busy — an eval is running (interrupt to kill it)"); pending.delete(m.id); return; }
    if(m.kind==="interrupt-sent"){ log("meta","interrupt sent"); return; }
    if(m.kind==="not-busy"){ log("meta","nothing running"); return; }
    if(m.kind==="completions"){ const p=pending.get(m.id); pending.delete(m.id); p?.resolve(m); return; }
    if(m.kind==="doc"){ const p=pending.get(m.id); pending.delete(m.id); p?.resolve(m); return; }
    if(m.kind==="balanced"){ const p=pending.get(m.id); pending.delete(m.id); p?.resolve(m); return; }
    if(m.kind==="bench"){ pending.delete(m.id);
      log("meta",`completion bench — corpus ${m.corpus} vars · index build ${m["index-build-ms"]}ms · direct (scan env) 5 queries ×10 = ${m["direct-5q-x10-ms"]}ms · indexed 5 queries ×100 = ${m["indexed-5q-x100-ms"]}ms`); return; }
  };
}
function rpc(op,fields={}){
  const id=++seq;
  return new Promise((resolve)=>{ pending.set(id,{resolve,t0:performance.now()}); ws.send(JSON.stringify({op,id,...fields})); });
}
function el(id){return document.getElementById(id);}
let entryCount=0; function lastEntry(){return el("e"+entryCount);}
function log(cls,text){ const d=document.createElement("div"); d.className="entry "+cls; d.textContent=text; el("log").appendChild(d); el("log").scrollTop=1e9; return d; }
function append(parent,cls,text){ if(!parent) return; const s=document.createElement("span"); s.className="entry "+cls; s.textContent=(parent.childNodes.length?"\n":"")+text; parent.appendChild(s); el("log").scrollTop=1e9; }
function meta(parent,text){ const s=document.createElement("span"); s.className="meta"; s.textContent="  ·  "+text; parent.appendChild(s); }

// ── eval ──
const hist=[]; let histIx=-1;
function submitEval(src){
  hist.push(src); localStorage.setItem("repl-spike-hist",JSON.stringify(hist.slice(-500))); histIx=-1;
  const e=log("","");
  append(e,"src",`${curNs}=> ${src}`); entryCount++; e.id="e"+entryCount;
  lastEvalId=seq+1;
  rpc("eval",{src});
  view.dispatch({changes:{from:0,to:view.state.doc.length,insert:""}});
}

// ── U5 parity: JS port vs server truth ──
async function parity(){
  const r=await rpc("balanced",{srcs:FIXTURES});
  const js=FIXTURES.map(balanced);
  const bad=FIXTURES.map((s,i)=>[i,r.results[i],js[i]]).filter(([i,a,b])=>a!==b);
  el("parity").textContent = bad.length===0 ? `balanced? parity ${FIXTURES.length}/${FIXTURES.length} ✓`
    : `balanced? MISMATCH on ${bad.map(b=>JSON.stringify(FIXTURES[b[0]])).join(", ")}`;
  el("parity").style.color = bad.length===0 ? "#46d18f" : "#ff8f8f";
}

async function completeSource(ctx){
  const word=ctx.matchBefore(/[A-Za-z0-9_\-.!*+?/<>=$]{2,}$/);
  if(!word||(word.from===word.to&&!ctx.explicit))return null;
  const r=await rpc("complete",{prefix:word.text});
  const options=r.items.map(i=>({
    label:i.label,
    detail:i.ns,
    info:((i.arglists&&i.arglists!=="")?i.arglists+"\n":"")+(i.doc||"")
  }));
  return {from:word.from, validFor:/^[A-Za-z0-9_\-.!*+?/<>=$]*$/, options};
}

// ── editor ──
const view=new EditorView({
  parent: el("editor-wrap"),
  doc:"",
  extensions:[
    keymap.of([
      {key:"Enter",run:(v)=>{ const src=v.state.doc.toString(); if(src.trim()&&balanced(src)){ submitEval(src); return true; } return insertNewlineAndIndent(v); }},
      {key:"Shift-Enter",run:insertNewlineAndIndent},
      {key:"Ctrl-ArrowUp",run:()=>{ if(!hist.length)return true; histIx=histIx<0?hist.length-1:Math.max(0,histIx-1); setDoc(hist[histIx]); return true; }},
      {key:"Ctrl-ArrowDown",run:()=>{ if(histIx<0)return true; histIx=histIx+1>=hist.length?-1:histIx+1; setDoc(histIx<0?"":hist[histIx]); return true; }},
    ]),
    basicSetup,
    clojureLanguage(),
    syntaxHighlighting(defaultHighlightStyle,{fallback:true}),
    EditorView.theme({},{dark:true}),
    autocompletion({override:[completeSource]}),
  ],
});
function clojureLanguage(){ return StreamLanguage.define(clojure); }
function setDoc(s){ view.dispatch({changes:{from:0,to:view.state.doc.length,insert:s}}); }
try{ const saved=JSON.parse(localStorage.getItem("repl-spike-hist")||"[]"); hist.push(...saved); }catch(e){}

el("interrupt").onclick=()=>rpc("interrupt");
el("bench").onclick=()=>rpc("bench");
connect();
view.focus();
</script>
</body>
</html>
